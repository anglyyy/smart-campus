<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTU Smart Campus Service Request System</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#9b2cff">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <h1>CTU Smart Campus <span class="hl">Service Requests</span></h1>
  <p class="tagline">Report it. Track it. Get it resolved.</p>
  <div id="message" role="alert"></div>

  <h2 class="label">New Request</h2>
  <form id="request-form" novalidate>
    <label>Student Name <input type="text" id="studentName"></label>
    <label>Type of Concern <select id="concernType"></select></label>
    <label>Description <textarea id="description"></textarea></label>
    <button type="submit">Submit Request</button>
  </form>

  <h2 class="label">Track Requests</h2>
  <section>
    <input type="text" id="searchBox" placeholder="Search by ID...">
    <select id="statusFilter"></select>
    <button type="button" id="syncBtn">Sync to campus server</button>
    <label class="toggle"><input type="checkbox" id="failToggle"> Simulate server failure</label>
    <p id="netStatus"></p>
    <ul id="request-list"></ul>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
