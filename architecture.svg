<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse">
        <path d="M0,0 L6,3 L0,6 z" fill="#e020d8"/>
    </marker>
  </defs>

  <rect width="700" height="600" fill="#050207"/>
  <text x="350" y="36" fill="#f5ecff" font-size="20" font-weight="700" text-anchor="middle">CTU Smart Campus Service Request System: Architecture</text>

  <!-- Layer 1: UI -->
  <rect x="40" y="60" width="480" height="110" rx="14" fill="#120a1f" stroke="#9b2cff" stroke-width="2"/>
  <text x="60" y="88" fill="#e020d8" font-size="14" font-weight="700">LAYER 1: USER INTERFACE (Client)</text>
  <text x="60" y="114" fill="#f5ecff" font-size="13">index.html, styles.css, ui.js</text>
  <text x="60" y="136" fill="#9d8bb8" font-size="12">Reads form fields, renders request list, shows messages</text>
  <text x="60" y="156" fill="#9d8bb8" font-size="12">Never validates and never touches storage</text>

  <!-- app.js -->
  <rect x="140" y="205" width="280" height="60" rx="14" fill="#1a0f2e" stroke="#e020d8" stroke-width="2"/>
  <text x="280" y="231" fill="#f5ecff" font-size="14" font-weight="700" text-anchor="middle">app.js (Controller)</text>
  <text x="280" y="251" fill="#9d8bb8" font-size="12" text-anchor="middle">Connects UI events to the service layer</text>

  <!-- Layer 2: Service -->
  <rect x="40" y="300" width="480" height="110" rx="14" fill="#120a1f" stroke="#9b2cff" stroke-width="2"/>
  <text x="60" y="328" fill="#e020d8" font-size="14" font-weight="700">LAYER 2: SERVICE / REQUEST PROCESSING</text>
  <text x="60" y="354" fill="#f5ecff" font-size="13">service.js</text>
  <text x="60" y="376" fill="#9d8bb8" font-size="12">validateRequest, generateId, createRequest</text>
  <text x="60" y="396" fill="#9d8bb8" font-size="12">changeStatus, searchRequests</text>

  <!-- Layer 3: Data -->
  <rect x="40" y="445" width="480" height="110" rx="14" fill="#120a1f" stroke="#9b2cff" stroke-width="2"/>
  <text x="60" y="473" fill="#e020d8" font-size="14" font-weight="700">LAYER 3: DATA MANAGEMENT</text>
  <text x="60" y="499" fill="#f5ecff" font-size="13">dataLayer.js to browser localStorage</text>
  <text x="60" y="521" fill="#9d8bb8" font-size="12">getAllRequests, saveRequest, updateRequest, getRequestById</text>
  <text x="60" y="541" fill="#9d8bb8" font-size="12">Only file that knows how data is stored</text>

  <!-- Config -->
  <rect x="550" y="205" width="130" height="200" rx="14" fill="#1a0f2e" stroke="#e020d8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="615" y="235" fill="#f5ecff" font-size="14" font-weight="700" text-anchor="middle">config.js</text>
  <text x="615" y="262" fill="#9d8bb8" font-size="12" text-anchor="middle">STATUSES</text>
  <text x="615" y="282" fill="#9d8bb8" font-size="12" text-anchor="middle">DEFAULT_STATUS</text>
  <text x="615" y="302" fill="#9d8bb8" font-size="12" text-anchor="middle">CONCERN_TYPES</text>
  <text x="615" y="340" fill="#9d8bb8" font-size="11" text-anchor="middle">Read by ui.js</text>
  <text x="615" y="358" fill="#9d8bb8" font-size="11" text-anchor="middle">and service.js</text>

  <!-- Arrows -->
  <line x1="280" y1="170" x2="280" y2="205" stroke="#e020d8" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="280" y1="265" x2="280" y2="300" stroke="#e020d8" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="280" y1="410" x2="280" y2="445" stroke="#e020d8" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="520" y1="305" x2="550" y2="305" stroke="#9b2cff" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>